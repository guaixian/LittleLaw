name: build-all-platforms

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # ------------------------------------------------ 核心引擎测试
  core-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.12.2"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - run: dart pub get
        working-directory: core
      # Linux 下 sqlite3 包加载系统 libsqlite3
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-0
      # rendezvous 集成测试需要服务器二进制
      - run: cd server && go build -o rendezvous.exe .
      - run: dart test
        working-directory: core

  # ------------------------------------------------ 中转服务器(可选组件)
  go-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - run: |
          cd server
          mkdir -p ../dist-server
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../dist-server/littlelaw-rendezvous-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ../dist-server/littlelaw-rendezvous-linux-arm64 .
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o ../dist-server/littlelaw-rendezvous-windows-amd64.exe .
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o ../dist-server/littlelaw-rendezvous-darwin-arm64 .
      - uses: actions/upload-artifact@v4
        with:
          name: rendezvous-server
          path: dist-server/

  # ------------------------------------------------ Windows
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter build windows --release
        working-directory: app
      - name: 打包 Inno Setup 安装程序
        shell: powershell
        run: |
          $ver = (Select-String -Path app/pubspec.yaml -Pattern '^version:\s*(.+)').Matches[0].Groups[1].Value.Trim() -replace '\+.*',''
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" tool\installer\littlelaw.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: app/build/windows/x64/runner/Release/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: app/build/windows-installer/

  # ------------------------------------------------ Linux
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev libpulse-dev
      - run: flutter pub get
        working-directory: app
      - run: flutter build linux --release
        working-directory: app
      - name: 打包 .deb
        run: |
          VER=$(grep -E '^version:' app/pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1)
          bash tool/installer/make_deb.sh "$VER" app/build/linux/x64/release/bundle app/build/linux-deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: app/build/linux/x64/release/bundle/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: app/build/linux-deb/

  # ------------------------------------------------ macOS
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter build macos --release
        working-directory: app
      - name: 瘦身并打包 DMG
        run: |
          set -e
          APP=$(ls -d app/build/macos/Build/Products/Release/*.app | head -1)
          echo "app: $APP"
          # 删除调试符号目录,缩小体积(WebRTC.xcframework 本体必需,保留)
          find "$APP" -name "*.dSYM" -type d -exec rm -rf {} + 2>/dev/null || true
          # ad-hoc 临时签名(免费,无开发者账号也能避免部分"已损坏"报错)
          codesign --force --deep --sign - "$APP" || true
          # 组装 DMG:应用 + Applications 快捷方式(拖放即装)+ 打开说明
          STAGE=app/build/dmg-stage
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          cat > "$STAGE/打开方法.txt" <<'EOF'
          LittleLaw 安装与打开说明
          ========================
          1. 把 LittleLaw.app 拖到右边的 Applications 文件夹完成安装。
          2. 首次打开若提示"无法验证开发者",请【右键】点击图标选「打开」,
             或到 系统设置 → 隐私与安全性 → 点「仍要打开」。
             也可以在终端执行:
             xattr -dr com.apple.quarantine /Applications/LittleLaw.app
          (应用未购买苹果开发者签名,属正常现象,源代码完全公开)
          EOF
          mkdir -p app/build/macos-dmg
          hdiutil create -volname LittleLaw -srcfolder "$STAGE" -ov -format UDZO \
            app/build/macos-dmg/littlelaw-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: app/build/macos/Build/Products/Release/
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: app/build/macos-dmg/

  # ------------------------------------------------ Android
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 签名库由 JDK 21 keytool 生成,读取端必须同版本以上
      # (旧版 JDK 读新 PKCS12 算法报 "Tag number over 30 is not supported")。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
      - run: flutter pub get
        working-directory: app
      - name: 解码发布签名密钥
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/littlelaw-release.keystore"
      - name: 构建签名 APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/littlelaw-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if ! flutter build apk --release --split-per-abi 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            {
              echo "## Java 版本"
              echo '```'
              java -version 2>&1
              echo '```'
              echo "## 密钥库指纹校验"
              echo '```'
              keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" 2>&1 | head -n 6
              echo '```'
              echo "## Gradle 错误摘要"
              echo '```'
              grep -iE -B 2 -A 10 "tag number|keytool|integrity|keystore|password|signing|failed" "$RUNNER_TEMP/build.log" | head -n 100
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: app/build/app/outputs/flutter-apk/*.apk

  # ------------------------------------------------ iOS(未签名,需自签或开发者账号)
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter build ios --release --no-codesign
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: app/build/ios/iphoneos/

  # ------------------------------------------------ 打包并发布 Release
  # 每次 main 推送滚动更新 nightly 预发布;推 v* tag 出正式版。
  release:
    needs: [windows, linux, macos, android, ios, go-server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 打包五端产物
        run: |
          set -e
          mkdir -p dist
          (cd artifacts/windows-x64 && zip -qr "$OLDPWD/dist/littlelaw-windows-x64.zip" .)
          (cd artifacts/linux-x64 && tar -czf "$OLDPWD/dist/littlelaw-linux-x64.tar.gz" .)
          (cd artifacts/macos && zip -qr "$OLDPWD/dist/littlelaw-macos.zip" .)
          cp artifacts/android-apks/*.apk dist/
          (cd artifacts/ios-unsigned && zip -qr "$OLDPWD/dist/littlelaw-ios-unsigned.zip" .)
          # 安装包
          cp artifacts/windows-installer/*.exe dist/ 2>/dev/null || true
          cp artifacts/linux-deb/*.deb dist/ 2>/dev/null || true
          cp artifacts/macos-dmg/*.dmg dist/ 2>/dev/null || true
          # 中转服务器二进制
          cp artifacts/rendezvous-server/* dist/ 2>/dev/null || true
          ls -lh dist
      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'nightly' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('LittleLaw {0}', github.ref_name) || 'LittleLaw Nightly(main 最新构建)' }}
          body: |
            五端构建产物(commit ${{ github.sha }}):
            - littlelaw-windows-x64-setup.exe(**Windows 安装程序**)/ windows-x64.zip(绿色版)
            - littlelaw-linux-amd64.deb(**DEB 安装包**)/ linux-x64.tar.gz(绿色版)
            - littlelaw-macos.dmg(**macOS 安装镜像**)/ macos.zip
            - android APK(arm64-v8a 为现代手机推荐)
            - littlelaw-ios-unsigned.zip(未签名,需自签安装)
            - littlelaw-rendezvous-*(可选中转服务器:linux/windows/darwin,amd64/arm64)
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/') }}
